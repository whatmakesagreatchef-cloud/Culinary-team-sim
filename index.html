  .progress-fill {
    height: 100%;

  // Core game logic
  applyEffect(effect) {
    if (!effect || !effect.op) return;
    
    if (effect.op === 'inc') {
      const keys = effect.path.split('.');
      let obj = this.state;
      for (let i = 0; i < keys.length - 1; i++) {
        obj = obj[keys[i]];
      }
      const lastKey = keys[keys.length - 1];
      obj[lastKey] = (obj[lastKey] || 0) + (effect.value || 0);
      
      // Apply bounds
      if (effect.path.includes('morale')) obj[lastKey] = Math.max(0, Math.min(100, obj[lastKey]));
      if (effect.path.includes('cohesion')) obj[lastKey] = Math.max(0, Math.min(100, obj[lastKey]));
      if (effect.path.includes('fatigue')) obj[lastKey] = Math.max(0, Math.min(100, obj[lastKey]));
      if (effect.path.includes('reputation')) obj[lastKey] = Math.max(0, obj[lastKey]);
    }
    
    if (effect.op === 'set') {
      const keys = effect.path.split('.');
      let obj = this.state;
      for (let i = 0; i < keys.length - 1; i++) {
        obj = obj[keys[i]];
      }
      obj[keys[keys.length - 1]] = effect.value;
    }
    
    if (effect.op === 'set_flag') {
      this.state.flags.add(effect.value);
    }
    
    if (effect.op === 'clear_flag') {
      this.state.flags.delete(effect.value);
    }
  }
  
  selectCountry(country) {
    this.state.country = country;
    this.state.team.budget += country.startingBonus.budget || 0;
    this.state.team.reputation += country.startingBonus.reputation || 0;
    this.state.team.readiness += country.startingBonus.readiness || 0;
    this.state.team.morale += country.startingBonus.morale || 0;
    
    this.state.screen = 'team_draft';
    this.render();
  }
  
  draftTeam(selectedArchetypes) {
    this.state.members = selectedArchetypes.map((arch, idx) => ({
      id: `member_${idx}`,
      name: this.generateName(),
      archetype: arch.id,
      archetypeName: arch.name,
      skills: { ...arch.baseSkills },
      traits: { ...arch.traits },
      morale: 60 + Math.floor(Math.random() * 20),
      fatigue: 0,
      relationships: {}
    }));
    
    // Initialize relationships
    for (let i = 0; i < this.state.members.length; i++) {
      for (let j = i + 1; j < this.state.members.length; j++) {
        const a = this.state.members[i];
        const b = this.state.members[j];
        const compatibility = (a.traits.teamwork + b.traits.teamwork) / 2 - 5;
        const baseRel = 50 + compatibility * 5 + (Math.random() * 20 - 10);
        a.relationships[b.id] = Math.round(baseRel);
        b.relationships[a.id] = Math.round(baseRel);
      }
    }
    
    this.state.screen = 'story';
    this.loadNextMission();
    this.render();
  }
  
  generateName() {
    const firsts = ['Alex', 'Jordan', 'Sam', 'Casey', 'Riley', 'Morgan', 'Taylor', 'Drew', 'Quinn', 'Avery'];
    const lasts = ['Chen', 'Smith', 'Garcia', 'Patel', 'Kim', 'Lopez', 'Brown', 'Wilson', 'Martinez', 'Lee'];
    return `${firsts[Math.floor(Math.random() * firsts.length)]} ${lasts[Math.floor(Math.random() * lasts.length)]}`;
  }
  
  loadNextMission() {
    const chapter = `CH${this.state.chapter}`;
    const missions = this.missions[chapter] || [];
    
    for (const mission of missions) {
      if (this.state.completedMissions.includes(mission.id)) continue;
      if (mission.week && mission.week > this.state.week) continue;
      
      // Check requirements
      const req = mission.requirements || {};
      if (req.min_reputation && this.state.team.reputation < req.min_reputation) continue;
      if (req.min_team_size && this.state.members.length < req.min_team_size) continue;
      
      this.state.currentMission = mission;
      return;
    }
    
    // No more missions this chapter - check for competition
    this.checkForCompetition();
  }
  
  checkForCompetition() {
    const comp = this.competitions.find(c => c.week === this.state.week);
    if (comp) {
      this.state.upcomingCompetition = comp;
      this.state.screen = 'competition';
    } else if (this.state.week >= this.state.totalWeeks) {
      this.state.screen = 'season_end';
    } else {
      // Advance week
      this.advanceWeek();
    }
  }
  
  makeChoice(choice) {
    const mission = this.state.currentMission;
    if (!mission) return;
    
    let outcome = choice.outcomes.success;
    
    // Check if there's a stat check
    if (choice.checks && choice.checks.length > 0) {
      const check = choice.checks[0];
      const keys = check.stat.split('.');
      let statValue = this.state;
      for (const key of keys) {
        statValue = statValue[key];
      }
      
      const roll = Math.floor(Math.random() * 20) + 1;
      const total = (statValue || 0) + roll;
      
      if (total < check.difficulty) {
        outcome = choice.outcomes.fail || choice.outcomes.success;
      }
    }
    
    // Apply effects
    if (outcome.effects) {
      outcome.effects.forEach(e => this.applyEffect(e));
    }
    
    // Mark mission complete
    this.state.completedMissions.push(mission.id);
    
    // Show result temporarily
    this.state.lastOutcome = outcome.text;
    this.render();
    
    setTimeout(() => {
      this.state.lastOutcome = null;
      this.loadNextMission();
      this.render();
    }, 2000);
  }
  
  advanceWeek() {
    this.state.week++;
    
    // Weekly recovery/costs
    this.state.team.fatigue = Math.max(0, this.state.team.fatigue - 10);
    this.state.team.budget -= 200; // Weekly costs
    
    // Update readiness
    this.updateReadiness();
    
    this.loadNextMission();
    this.render();
  }
  
  updateReadiness() {
    const t = this.state.team;
    const avgSkill = this.state.members.length > 0
      ? this.state.members.reduce((sum, m) => {
          return sum + (m.skills.technical + m.skills.creativity + m.skills.speed + m.skills.consistency) / 4;
        }, 0) / this.state.members.length
      : 50;
    
    const readiness = avgSkill * 0.5
                    + t.morale * 0.15
                    + t.cohesion * 0.15
                    + t.reputation * 0.1
                    - t.fatigue * 0.25
                    - t.risk * 0.1
                    + t.workflow_bonus;
    
    this.state.team.readiness = Math.max(0, Math.min(100, Math.round(readiness)));
  }
  enterCompetition() {
    const comp = this.state.upcomingCompetition;
    if (!comp) return;

    // Eligibility gates
    if (this.state.team.budget < (comp.entry_fee || 0)) {
      alert('Insufficient budget!');
      return;
    }
    if (comp.gates?.min_reputation && this.state.team.reputation < comp.gates.min_reputation) {
      alert('Reputation too low!');
      return;
    }
    if (comp.gates?.requires_medal) {
      const noMedals = (this.state.medals.gold === 0 && this.state.medals.silver === 0 && this.state.medals.bronze === 0);
      if (noMedals) {
        alert('Need at least one medal to enter!');
        return;
      }
    }

    // Pay entry fee
    this.state.team.budget -= (comp.entry_fee || 0);

    // Hot Kitchen Mode (interactive)
    if (comp.format === 'team_hot_kitchen') {
      this.startHotKitchen(comp);
      return;
    }

    // Simulate competition (non-interactive)
    const result = this.simulateCompetition(comp);
    this.applyCompetitionOutcome(comp, result);

    this.state.screen = 'competition';
    this.render();
  }
  applyCompetitionOutcome(comp, result) {
    this.state.competitionResult = result;
    this.state.totalCompetitions++;

    // Defensive defaults (prevents crashes if a comp is missing fields)
    const prize = comp?.prize || { first: 0, second: 0, third: 0 };
    const stakes = comp?.stakes || { reputation_gain_win: 0, reputation_loss_bad: 0 };

    // Apply medals + prizes + reputation
    if (result?.placement === 1) {
      this.state.medals.gold++;
      this.state.team.budget += (prize.first || 0);
      this.state.team.reputation += (stakes.reputation_gain_win || 0);
      this.state.team.morale = Math.min(100, this.state.team.morale + 15);
    } else if (result?.placement === 2) {
      this.state.medals.silver++;
      this.state.team.budget += (prize.second || 0);
      this.state.team.reputation += Math.floor((stakes.reputation_gain_win || 0) * 0.6);
      this.state.team.morale = Math.min(100, this.state.team.morale + 10);
    } else if (result?.placement === 3) {
      this.state.medals.bronze++;
      this.state.team.budget += (prize.third || 0);
      this.state.team.reputation += Math.floor((stakes.reputation_gain_win || 0) * 0.4);
      this.state.team.morale = Math.min(100, this.state.team.morale + 8);
    } else if ((result?.placement || 0) > 10) {
      this.state.team.reputation = Math.max(0, this.state.team.reputation + (stakes.reputation_loss_bad || -5));
      this.state.team.morale = Math.max(0, this.state.team.morale - 10);
    }

    // Competition-day fatigue
    this.state.team.fatigue = Math.min(100, this.state.team.fatigue + (result?.hotKitchen ? 18 : 15));

    // Achievements
    this.checkAchievements(comp, result);
  }

  // ---------- Achievements (safe, lightweight; prevents crashes) ----------
  checkAchievements(comp, result) {
    // Ensure container exists
    if (!this.state.achievements) this.state.achievements = [];

    // Helpers
    const add = (id, title, desc) => {
      if (this.state.achievements.some(a => a.id === id)) return;
      this.state.achievements.push({ id, title, desc, unlockedWeek: this.state.week });
    };

    // Basic achievement set (expand later)
    if ((this.state.medals?.gold || 0) >= 1) add('first_gold', 'First Gold', 'Win your first gold medal.');
    if ((this.state.totalCompetitions || 0) >= 5) add('five_comps', 'Seasoned', 'Complete 5 competitions.');
    if ((result?.hotKitchen) && (result?.penalties || []).includes('cross_contamination') === false) {
      // only if you played hot kitchen and avoided a major hygiene hit
      add('clean_service', 'Clean Service', 'Complete a hot kitchen service without a major hygiene warning.');
    }
    if ((result?.placement || 99) <= 3 && comp?.type === 'national') add('national_podium', 'National Podium', 'Place on the podium at a national competition.');
    if ((this.state.team?.reputation || 0) >= 60) add('respected', 'Respected', 'Reach 60 reputation.');
    if ((this.state.team?.budget || 0) >= 50000) add('funded', 'Funded', 'Build a 50k budget.');
  }




  continueAfterCompetition() {
    this.state.upcomingCompetition = null;
    this.state.competitionResult = null;
    
    if (this.state.week >= this.state.totalWeeks) {
      this.endSeason();
    } else {
      this.advanceWeek();
    }
  }
  
  endSeason() {
    // Calculate season score
    const seasonScore = {
      medals: this.state.medals.gold * 1000 + this.state.medals.silver * 500 + this.state.medals.bronze * 250,
      reputation: this.state.team.reputation * 50,
      budget: Math.max(0, this.state.team.budget),
      total: 0
    };
    seasonScore.total = seasonScore.medals + seasonScore.reputation + Math.floor(seasonScore.budget / 10);
    
    this.state.seasonHistory.push({
      season: this.state.season,
      score: seasonScore.total,
      medals: { ...this.state.medals },
      reputation: this.state.team.reputation
    });
    
    this.state.screen = 'season_end';
    this.state.seasonScore = seasonScore;
    this.render();
  }
  
  startNewSeason() {
    this.state.season++;
    this.state.week = 1;
    this.state.chapter = 1;
    this.state.completedMissions = [];
    this.state.medals = { gold: 0, silver: 0, bronze: 0 };
    
    // Carry over some state
    // Budget, reputation, team members persist
    
    this.state.screen = 'story';
    this.loadNextMission();
    this.render();
  }
  
  // Rendering
  
  // ---------- Competition Day: Hot Kitchen Mode (Competition Service) ----------
  startHotKitchen(comp) {
    // Initialize interactive hot kitchen state
    const members = this.state.members || [];
    const pickBest = (station) => {
      if (!members.length) return null;
      const score = (m) => {
        const s = m.skills || {};
        if (station === 'pass') return (s.teamwork + s.consistency) / 2;
        if (station === 'protein') return (s.technique + s.speed) / 2;
        if (station === 'sauce') return (s.technique + s.consistency) / 2;
        if (station === 'garnish') return (s.creativity + s.speed) / 2;
        return (s.speed + s.consistency) / 2;
      };
      return members.slice().sort((a,b)=>score(b)-score(a))[0]?.id || null;
    };

    const duration = 180;
    const phases = [
      { id:'brief', name:'Briefing', minutes: 10 },
      { id:'mise', name:'Mise en place', minutes: 45 },
      { id:'cook', name:'Cook Window', minutes: 95 },
      { id:'plate', name:'Plating & Pass', minutes: 30 }
    ];

    // Baseline criteria (0-10) from team state
    const t = this.state.team;
    const base = {
      taste: Math.max(0, Math.min(10, 5 + t.readiness/28 + t.morale/45 - t.fatigue/55)),
      technique: Math.max(0, Math.min(10, 5 + t.reputation/18 + t.readiness/30)),
      workflow: Math.max(0, Math.min(10, 5 + t.cohesion/26 + t.workflow_bonus/4 - t.fatigue/80)),
      hygiene: Math.max(0, Math.min(10, 5 + (100-t.fatigue)/70)),
      presentation: Math.max(0, Math.min(10, 5 + t.reputation/24 + t.readiness/40)),
      timing: Math.max(0, Math.min(10, 5 + t.cohesion/70 - t.fatigue/70))
    };

    const bias = (this.state.country?.rubric_bias) || { taste:1, technique:1, workflow:1, hygiene:1, presentation:1, timing:1 };
    Object.keys(base).forEach(k => base[k] = Math.max(0, Math.min(10, base[k] * (bias[k] || 1))));

    // Stations + task list (with dependencies)
    const tasks = this.getHotKitchenTasks();
    const stations = ['pass','protein','sauce','garnish'];

    const buildTaskState = () => {
      const byId = {};
      tasks.forEach(tk => { byId[tk.id] = { ...tk, done:false }; });
      return byId;
    };

    const taskState = buildTaskState();

    // Ticket rail (competition service = waves)
    // 4 judge plates due at 150m, 4 display plates due at 180m
    const tickets = [];
    for (let i=1;i<=4;i++){
      tickets.push({ id:`J${i}`, label:`Judge Plate ${i}`, dueAt:150, status:'pending', sentAt:null, requires:['pass_plate_map','protein_cook','sauce_finish','garnish_ready','pass_wipe_discipline'] });
    }
    for (let i=1;i<=4;i++){
      tickets.push({ id:`D${i}`, label:`Display Plate ${i}`, dueAt:180, status:'pending', sentAt:null, requires:['pass_plate_map','protein_cook','sauce_finish','garnish_ready','pass_wipe_discipline'] });
    }

    this.state.hotKitchen = {
      compId: comp.id,
      compName: comp.name,
      duration,
      phases,
      phaseIndex: 0,
      timeElapsed: 0,
      timeLeft: duration,
      focus: 3,
      pressure: 20,
      cleanliness: 85,
      comms: 75,
      riskMeter: Math.max(0, Math.min(100, (t.risk || 0) * 10)),
      assignments: {
        pass: pickBest('pass'),
        protein: pickBest('protein'),
        sauce: pickBest('sauce'),
        garnish: pickBest('garnish')
      },
      taskState,
      tickets,
      incident: null,
      baseCriteria: base,
      delta: { taste:0, technique:0, workflow:0, hygiene:0, presentation:0, timing:0 },
      penalties: [],
      log: [],
      actionLog: []
    };

    this.state.screen = 'hot_kitchen';
    this.render();
  }

      // PASS / CAPTAIN

      { id:'garnish_ready', station:'garnish', label:'Final Garnish Ready (staging)', minutes:6, prereq:['garnish_cook','garnish_puree'], effects:{ workflow:+0.2, timing:+0.2 } },

  hkMemberById(id) {
    return (this.state.members || []).find(m => m.id === id);
  }

  hkStationSkill(station) {
    const m = this.hkMemberById(this.state.hotKitchen.assignments[station]);
    if (!m) return 5;
    const s = m.skills || {};
    if (station === 'pass') return (s.teamwork + s.consistency) / 2;
    if (station === 'protein') return (s.technique + s.speed) / 2;
    if (station === 'sauce') return (s.technique + s.consistency) / 2;
    if (station === 'garnish') return (s.creativity + s.speed) / 2;
    return 5;
  }

  hkRoll(station, difficulty) {
    // station skill (0-10) mapped to modifier ~0-10, plus d20
    const mod = Math.round(this.hkStationSkill(station));
    const roll = Math.floor(Math.random()*20)+1;
    const total = roll + mod;
    return { roll, mod, total, success: total >= difficulty };
  }

  hkAdvance(minutes) {
    const hk = this.state.hotKitchen;
    hk.timeElapsed = Math.min(hk.duration, hk.timeElapsed + minutes);
    hk.timeLeft = Math.max(0, hk.duration - hk.timeElapsed);

    // Phase tracking
    let t = hk.timeElapsed;
    let cum = 0;
    let idx = 0;
    for (let i=0;i<hk.phases.length;i++){
      cum += hk.phases[i].minutes;
      if (t <= cum) { idx = i; break; }
      idx = i;
    }
    hk.phaseIndex = idx;

    // Pressure naturally rises as time burns
    hk.pressure = Math.max(0, Math.min(100, hk.pressure + (minutes * 0.35)));
    // Cleanliness decays unless maintained
    hk.cleanliness = Math.max(0, Math.min(100, hk.cleanliness - (minutes * 0.25)));
    // Comms decays under pressure
    hk.comms = Math.max(0, Math.min(100, hk.comms - (minutes * 0.12)));

    // Behind-schedule bonus pressure: if tasks incomplete late in day
    const required = ['pass_plate_map','protein_cook','sauce_finish','garnish_ready'];
    const doneCount = required.filter(id => hk.taskState[id]?.done).length;
    if (hk.timeElapsed > 120 && doneCount < 3) hk.pressure = Math.min(100, hk.pressure + 8);

    this.hkMaybeIncident();
  }

  hkApplyEffects(effects) {
    const hk = this.state.hotKitchen;
    const d = hk.delta;

    // Criteria deltas
    for (const k of ['taste','technique','workflow','hygiene','presentation','timing']) {
      if (effects[k]) d[k] += effects[k];
    }

    // Meters
    if (effects.pressure) hk.pressure = Math.max(0, Math.min(100, hk.pressure + effects.pressure));
    if (effects.cleanliness) hk.cleanliness = Math.max(0, Math.min(100, hk.cleanliness + effects.cleanliness));
    if (effects.comms) hk.comms = Math.max(0, Math.min(100, hk.comms + effects.comms));
  }

  hkDoTask(taskId) {
    const hk = this.state.hotKitchen;
    if (!hk || hk.incident) return;

    const t = hk.taskState[taskId];
    if (!t || t.done) return;

    // Check prerequisites
    const prereq = t.prereq || [];
    const missing = prereq.filter(pid => !hk.taskState[pid]?.done);
    if (missing.length) {
      hk.log.push(`⛔ Can't do "${t.label}" yet. Missing: ${missing.map(x=>hk.taskState[x]?.label||x).join(', ')}`);
      this.render();
      return;
    }

    // Skill check (optional): harder tasks can fail under pressure
    const baseDiff = 16;
    const diff = baseDiff + Math.floor((hk.pressure-40)/15);
    const station = t.station;
    const check = this.hkRoll(station, diff);

    // Advance time regardless
    hk.actionLog.push({ type:'task', taskId, station, minutes:t.minutes, check });
    this.hkAdvance(t.minutes);

    if (check.success) {
      t.done = true;
      this.hkApplyEffects(t.effects || {});
      hk.log.push(`✅ ${t.label} (${station}) — success. (d20 ${check.roll}+${check.mod} vs ${diff})`);
    } else {
      // partial: time spent, small penalty, increases risk of later incidents
      hk.pressure = Math.min(100, hk.pressure + 6);
      hk.delta.workflow -= 0.15;
      hk.log.push(`⚠️ ${t.label} (${station}) — sloppy under pressure. (d20 ${check.roll}+${check.mod} vs ${diff})`);
    }

    this.render();
  }

  hkSpendFocus(kind) {
    const hk = this.state.hotKitchen;
    if (!hk || hk.focus <= 0) return;

    hk.focus -= 1;
    if (kind === 'calm') {
      hk.pressure = Math.max(0, hk.pressure - 18);
      hk.comms = Math.min(100, hk.comms + 10);
      hk.log.push('🎧 Coach intervention: calm reset + comms clarity.');
    } else if (kind === 'clean') {
      hk.cleanliness = Math.min(100, hk.cleanliness + 18);
      hk.delta.hygiene += 0.25;
      hk.log.push('🧼 Coach intervention: wipe discipline + station reset.');
    } else if (kind === 'qc') {
      hk.delta.taste += 0.25;
      hk.delta.presentation += 0.15;
      hk.log.push('👀 Coach intervention: QC round before sending plates.');
    }
    this.render();
  }

  hkSendTicket(ticketId) {
    const hk = this.state.hotKitchen;
    if (!hk || hk.incident) return;

    const ticket = hk.tickets.find(t => t.id === ticketId);
    if (!ticket || ticket.status === 'sent') return;

    const missing = (ticket.requires || []).filter(id => !hk.taskState[id]?.done);
    const now = hk.timeElapsed;

    // Sending costs time (coordination)
    this.hkAdvance(3);

    if (missing.length) {
      hk.penalties.push('missing_element');
      hk.delta.presentation -= 0.35;
      hk.delta.taste -= 0.25;
      hk.log.push(`❌ Sent ${ticket.label} with missing elements. (-presentation, -taste)`);
    }

    if (now > ticket.dueAt) {
      hk.penalties.push('late_plating');
      hk.delta.timing -= 0.45;
      hk.delta.workflow -= 0.15;
      hk.log.push(`⏱️ ${ticket.label} went late. (-timing)`);
      ticket.status = 'late';
    } else if (now < ticket.dueAt - 8) {
      hk.delta.timing += 0.15;
      hk.log.push(`✅ ${ticket.label} went out early and clean. (+timing)`);
      ticket.status = 'sent';
    } else {
      ticket.status = 'sent';
      hk.log.push(`✅ ${ticket.label} sent on time.`);
    }

    ticket.sentAt = now;

    // Pressure relief after sending
    hk.pressure = Math.max(0, hk.pressure - 6);

    // Auto-finish if all sent or time over
    const allSent = hk.tickets.every(t=>t.status==='sent' || t.status==='late');
    if (allSent || hk.timeLeft <= 0) {
      this.hkFinalize();
      return;
    }

    this.render();
  }

  hkMaybeIncident() {
    const hk = this.state.hotKitchen;
    if (!hk || hk.incident) return;

    // Probability increases with pressure + low comms + risk meter
    const p = (hk.pressure/140) + ((100-hk.comms)/220) + (hk.riskMeter/400);
    if (Math.random() > p) return;

    // Build incident deck (weight by phase)
    const phase = hk.phases[hk.phaseIndex]?.id || 'cook';
    const deck = this.getHotKitchenIncidents(phase);
    const incident = deck[Math.floor(Math.random()*deck.length)];
    if (!incident) return;

    hk.incident = JSON.parse(JSON.stringify(incident)); // clone
    hk.log.push(`🔥 INCIDENT: ${hk.incident.title}`);
  }

  hkResolveIncident(optionId) {
    const hk = this.state.hotKitchen;
    if (!hk || !hk.incident) return;

    const option = hk.incident.options.find(o => o.id === optionId);
    if (!option) return;

    const check = this.hkRoll(option.station, option.diff);
    // incident takes time
    this.hkAdvance(4);

    if (check.success) {
      this.hkApplyEffects(option.onSuccess || {});
      hk.log.push(`✅ ${hk.incident.title}: ${option.label} succeeded. (d20 ${check.roll}+${check.mod} vs ${option.diff})`);
    } else {
      this.hkApplyEffects(option.onFail || {});
      hk.log.push(`❌ ${hk.incident.title}: ${option.label} failed. (d20 ${check.roll}+${check.mod} vs ${option.diff})`);
      // extra penalty chance
      if (hk.cleanliness < 45 && Math.random() < 0.25) {
        hk.penalties.push('cross_contamination');
        hk.delta.hygiene -= 0.8;
        hk.log.push('🚫 Hygiene warning flagged by judge. (major hit)');
      }
    }

    hk.incident = null;
    this.render();
  }

  hkSetAssignment(station, memberId) {
    const hk = this.state.hotKitchen;
    if (!hk) return;
    hk.assignments[station] = memberId;
    this.render();
  }

  hkFinalize() {
    const hk = this.state.hotKitchen;
    const comp = this.state.upcomingCompetition;

    // Compute final criteria
    const criteria = {};
    for (const k of Object.keys(hk.baseCriteria)) {
      let v = hk.baseCriteria[k] + hk.delta[k];

      // Environment influence
      if (k === 'hygiene') v += (hk.cleanliness - 70) / 60;
      if (k === 'workflow') v += (hk.comms - 70) / 90;
      if (k === 'timing') v += (100 - hk.pressure) / 180;

      criteria[k] = Math.max(0, Math.min(10, v));
    }

    // Hot kitchen weights (competition service)
    const w = { taste:0.28, technique:0.24, workflow:0.20, hygiene:0.12, presentation:0.10, timing:0.06 };
    let score = 0;
    Object.keys(w).forEach(k => score += criteria[k] * w[k] * 10);

    // Penalty adjustments
    const lateCount = hk.penalties.filter(p=>p==='late_plating').length;
    const missingCount = hk.penalties.filter(p=>p==='missing_element').length;
    const cross = hk.penalties.includes('cross_contamination');

    score -= lateCount * 3;
    score -= missingCount * 2.5;
    if (cross) score -= 18;

    score = Math.max(0, Math.min(100, score));

    // Opponent field + placement
    const field = this.generateOpponents(comp, 14);
    const player = { name:`${this.state.country?.flag || ''} Your Team`, country:this.state.country?.name || 'You', score: score, isPlayer:true };
    const ranked = this.rankField(field, player);
    const placement = ranked.findIndex(x=>x.isPlayer) + 1;

    const narrative = placement <= 3
      ? "You held the pass together under pressure and delivered clean plates."
      : placement > 10
        ? "Small mistakes stacked up. The judges felt the inconsistency."
        : "A solid service — not perfect, but competitive."

    const commentary = this.generateCommentary(comp, { score, placement, criteria, penalties: hk.penalties, cleanliness: hk.cleanliness, comms: hk.comms });

    const result = {
      hotKitchen: true,
      score: Math.round(score),
      placement,
      criteria,
      penalties: hk.penalties,
      narrative,
      log: hk.log.slice(-10),
      leaderboard: ranked.slice(0, 10),
      commentary
    };

    this.applyCompetitionOutcome(comp, result);
    this.state.hotKitchen = null;
    this.state.screen = 'competition';
    this.render();
  }

  // ---------- Opponent Field + Commentary (used for all competition results) ----------
  generateOpponents(comp, n=12) {
    const pools = [
      "Northern Flame", "Copper & Salt", "Black Apron", "Saffron Syndicate", "Harbor Fire",
      "Red Knife Collective", "Eclipse Kitchen", "Glasshouse Crew", "Iron Ladle", "Blue Smoke Brigade",
      "Citrus & Steel", "Garnish Guild", "The Precision Plate", "Wild Coast Chefs", "Midnight Mise"
    ];
    const countries = [
      { name:"France", flag:"🇫🇷" }, { name:"Japan", flag:"🇯🇵" }, { name:"USA", flag:"🇺🇸" },
      { name:"Australia", flag:"🇦🇺" }, { name:"Italy", flag:"🇮🇹" }, { name:"Spain", flag:"🇪🇸" },
      { name:"UK", flag:"🇬🇧" }, { name:"Sweden", flag:"🇸🇪" }, { name:"Singapore", flag:"🇸🇬" }
    ];
    const tierBase = comp.type === 'local' ? 55 : comp.type === 'regional' ? 62 : comp.type === 'national' ? 68 : comp.type === 'bocuse' ? 72 : comp.type === 'worldcup' ? 75 : 78;
    const rand = (a,b)=>Math.random()*(b-a)+a;

    const used = new Set();
    const field = [];
    for (let i=0;i<n;i++){
      let name;
      do { name = pools[Math.floor(Math.random()*pools.length)]; } while(used.has(name));
      used.add(name);
      const c = countries[Math.floor(Math.random()*countries.length)];
      const strength = tierBase + rand(-8, +8);
      const score = Math.max(0, Math.min(100, strength + rand(-6, +6)));
      field.push({ name:`${c.flag} ${name}`, country:c.name, score:Number(score.toFixed(1)), isPlayer:false });
    }
    return field;
  }

  rankField(field, playerEntry) {
    const all = [...field, playerEntry];
    all.sort((a,b)=>b.score - a.score);
    return all;
  }

  generateCommentary(comp, res) {
    const lines = [];
    if (res.placement <= 3) lines.push("Judges praised your composure and consistency on the pass.");
    if (res.placement > 10) lines.push("The panel noted uneven execution across components.");
    if (res.criteria?.taste >= 8.2) lines.push("Your flavour balance landed — clean seasoning and depth.");
    if (res.criteria?.workflow <= 5.5) lines.push("Workflow looked frantic at times; handoffs cost seconds.");
    if (res.penalties?.includes('late_plating')) lines.push("Late plating dragged timing marks down.");
    if (res.penalties?.includes('missing_element')) lines.push("A missing element was called out in the critique.");
    if (res.penalties?.includes('cross_contamination')) lines.push("A hygiene issue triggered a major deduction.");
    if (res.cleanliness !== undefined && res.cleanliness >= 85) lines.push("Your station discipline stayed sharp — cloth control was obvious.");
    if (res.comms !== undefined && res.comms >= 80) lines.push("Short calls and clear leadership improved the team rhythm.");
    // ensure 3-5
    while (lines.length < 3) lines.push("Small decisions under pressure shaped the final score.");
    return lines.slice(0,5);
  }

  // ---------- Enhanced competition simulation for non-hot-kitchen formats ----------
  simulateCompetition(comp) {
    // If format is hot kitchen, this should not be called (interactive mode handles it)
    const t = this.state.team;
    const bias = this.state.country?.rubric_bias || { taste:1, technique:1, workflow:1, hygiene:1, presentation:1, timing:1 };

    const clamp = (v)=>Math.max(0, Math.min(10, v));
    const rand = (a,b)=>Math.random()*(b-a)+a;

    // Base criteria
    const criteria = {
      taste: clamp(5 + t.readiness/30 + t.morale/40 - t.fatigue/55 + rand(-1.0,1.0)),
      technique: clamp(5 + t.reputation/20 + t.readiness/28 + rand(-1.0,1.0)),
      workflow: clamp(5 + t.cohesion/30 + t.workflow_bonus/4 - t.fatigue/80 + rand(-1.0,1.0)),
      hygiene: clamp(5 + (100-t.fatigue)/65 + rand(-1.0,1.0)),
      presentation: clamp(5 + t.reputation/25 + t.readiness/35 + rand(-1.0,1.0)),
      timing: clamp(5 + t.cohesion/80 - t.fatigue/70 + rand(-1.0,1.0))
    };

    // Apply bias
    Object.keys(criteria).forEach(k => criteria[k] = clamp(criteria[k] * (bias[k] || 1)));

    // Format-specific weights + special rules
    let w = { taste:0.25, technique:0.22, workflow:0.18, hygiene:0.12, presentation:0.13, timing:0.10 };
    const penalties = [];

    if (comp.format === 'solo_live_cooking') {
      w = { taste:0.28, technique:0.26, workflow:0.10, hygiene:0.12, presentation:0.12, timing:0.12 };
      if (t.fatigue > 70 && Math.random() < 0.18) { penalties.push('late_plating'); criteria.timing = clamp(criteria.timing - 1.2); }
    } else if (comp.format === 'team_relay') {
      w = { taste:0.24, technique:0.22, workflow:0.24, hygiene:0.10, presentation:0.10, timing:0.10 };
      if (t.cohesion < 40 && Math.random() < 0.25) { penalties.push('handoff_error'); criteria.workflow = clamp(criteria.workflow - 1.1); }
    } else if (comp.format === 'bocuse_duo') {
      w = { taste:0.22, technique:0.26, workflow:0.12, hygiene:0.10, presentation:0.22, timing:0.08 };
      if (Math.random() < 0.14 + (t.risk/80)) { penalties.push('finish_fault'); criteria.presentation = clamp(criteria.presentation - 0.9); }
    } else if (comp.format === 'worldcup_multi' || comp.format === 'olympics_multi') {
      // multi-module: average of 3-4 modules; endurance matters
      const modules = comp.format === 'worldcup_multi'
        ? ['hot','cold','pastry']
        : ['hot','cold','pastry','buffet'];

      let modScores = [];
      modules.forEach(mod => {
        let modCriteria = { ...criteria };
        if (mod === 'cold') {
          modCriteria.presentation = clamp(modCriteria.presentation + 0.6);
          modCriteria.hygiene = clamp(modCriteria.hygiene + 0.2);
        }
        if (mod === 'pastry') {
          modCriteria.technique = clamp(modCriteria.technique + 0.4);
          modCriteria.presentation = clamp(modCriteria.presentation + 0.4);
          if (Math.random() < 0.10 + (t.fatigue/200)) { penalties.push('structure_failure'); modCriteria.presentation = clamp(modCriteria.presentation - 0.8); }
        }
        if (mod === 'buffet') {
          modCriteria.workflow = clamp(modCriteria.workflow + 0.5);
          modCriteria.timing = clamp(modCriteria.timing - 0.2);
          if (Math.random() < 0.12 + (t.risk/120)) { penalties.push('missing_element'); modCriteria.workflow = clamp(modCriteria.workflow - 0.6); }
        }
        const wm = mod === 'hot'
          ? { taste:0.26, technique:0.24, workflow:0.20, hygiene:0.12, presentation:0.10, timing:0.08 }
          : mod === 'cold'
            ? { taste:0.22, technique:0.20, workflow:0.14, hygiene:0.14, presentation:0.24, timing:0.06 }
            : mod === 'pastry'
              ? { taste:0.22, technique:0.26, workflow:0.12, hygiene:0.10, presentation:0.24, timing:0.06 }
              : { taste:0.24, technique:0.22, workflow:0.20, hygiene:0.10, presentation:0.18, timing:0.06 };

        let s = 0; Object.keys(wm).forEach(k => s += modCriteria[k] * wm[k] * 10);
        modScores.push(s);
      });

      let avg = modScores.reduce((a,b)=>a+b,0) / modScores.length;
      // endurance penalty
      avg -= Math.max(0, (t.fatigue - 55) * 0.25);
      // tiny variance
      avg += rand(-2.5,2.5);
      let score = Math.max(0, Math.min(100, avg));

      const field = this.generateOpponents(comp, comp.format === 'olympics_multi' ? 24 : 18);
      const player = { name:`${this.state.country?.flag || ''} Your Team`, country:this.state.country?.name || 'You', score: Number(score.toFixed(1)), isPlayer:true };
      const ranked = this.rankField(field, player);
      const placement = ranked.findIndex(x=>x.isPlayer) + 1;

      return {
        score: Math.round(score),
        placement,
        criteria,
        penalties,
        leaderboard: ranked.slice(0, 10),
        commentary: this.generateCommentary(comp, { score, placement, criteria, penalties })
      };
    }

    // Default weighted score
    let score = 0;
    Object.keys(w).forEach(k => score += criteria[k] * w[k] * 10);

    // mistake chance
    if (t.fatigue > 70 && Math.random() < 0.18) {
      penalties.push('major_mistake');
      score -= 10;
    }
    score = Math.max(0, Math.min(100, score));

    const field = this.generateOpponents(comp, comp.type === 'local' ? 10 : comp.type === 'regional' ? 14 : 18);
    const player = { name:`${this.state.country?.flag || ''} Your Team`, country:this.state.country?.name || 'You', score: Number(score.toFixed(1)), isPlayer:true };
    const ranked = this.rankField(field, player);
    const placement = ranked.findIndex(x=>x.isPlayer) + 1;

    return {
      score: Math.round(score),
      placement,
      criteria,
      penalties,
      leaderboard: ranked.slice(0, 10),
      commentary: this.generateCommentary(comp, { score, placement, criteria, penalties })
    };
  }

  attachEventListeners() {
    // Team draft selection
    if (this.state.screen === 'team_draft') {
      const selectedArchetypes = [];
      const cards = document.querySelectorAll('.archetype-card');
      const confirmBtn = document.getElementById('confirmDraft');
      const countEl = document.getElementById('selectedCount');
      
      cards.forEach(card => {
        card.addEventListener('click', () => {
          const id = card.dataset.archetype;
          const arch = this.archetypes.find(a => a.id === id);
          
          if (card.classList.contains('border-cyan-400')) {
            // Deselect
            card.classList.remove('border-cyan-400', 'bg-cyan-900', 'bg-opacity-20');
            const idx = selectedArchetypes.findIndex(a => a.id === id);
            if (idx > -1) selectedArchetypes.splice(idx, 1);
          } else {
            // Select (if not at limit)
            if (selectedArchetypes.length < 4) {
              card.classList.add('border-cyan-400', 'bg-cyan-900', 'bg-opacity-20');
              selectedArchetypes.push(arch);
            }
          }
          
          countEl.textContent = selectedArchetypes.length;
          
          if (selectedArchetypes.length >= 3) {
            confirmBtn.disabled = false;
            confirmBtn.classList.remove('opacity-50');
          } else {
            confirmBtn.disabled = true;
            confirmBtn.classList.add('opacity-50');
          }
        });
      });
      
      confirmBtn.addEventListener('click', () => {
        if (selectedArchetypes.length >= 3) {
          this.draftTeam(selectedArchetypes);
        }
      });
    }
  }
}


// Initialize game (with visible error reporting)
let game;

function showFatalError(err, context='') {
  const app = document.getElementById('app');
  if (!app) return;
  const msg = (err && (err.stack || err.message)) ? (err.stack || err.message) : String(err);
  app.innerHTML = `
    <div style="min-height:100vh; padding:24px; color: #e7eefc; font-family: system-ui, -apple-system, sans-serif;">
      <h1 style="font-size:28px; font-weight:800; margin-bottom:12px;">⚠️ Global Kitchen failed to load</h1>
      <div style="opacity:.9; margin-bottom:16px;">${context ? context : 'A runtime error occurred.'}</div>
      <pre style="white-space:pre-wrap; background: rgba(255,255,255,.06); border: 1px solid rgba(231,238,252,.14); padding:16px; border-radius:12px; overflow:auto;">${msg}</pre>
      <div style="margin-top:16px; opacity:.9;">
        Tip: if you're on GitHub Pages, hard refresh (iOS Safari: pull down to reload) or clear cache. If this is a local file, try opening via GitHub Pages.
      </div>
    </div>
  `;
}

window.addEventListener('error', (e) => {
  showFatalError(e.error || e.message || 'Unknown error', 'Window error event');
});

window.addEventListener('unhandledrejection', (e) => {
  showFatalError(e.reason || 'Unhandled promise rejection', 'Unhandled promise rejection');
});

document.addEventListener('DOMContentLoaded', () => {
  const app = document.getElementById('app');
  if (app) {
    app.innerHTML = `<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; color:#e7eefc; opacity:.9;">Loading…</div>`;
  }
  try {
    game = new CulinaryStorySimulator();
  } catch (err) {
    showFatalError(err, 'Error while constructing the game');
  }
});

</script>
